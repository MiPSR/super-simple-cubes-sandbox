[package]
name = "ssc-engine"
description = "Super Simple Cubes rendering engine (the only crate that touches GFX APIs)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ssc-math = { path = "../ssc-math" }
glam.workspace = true
# The windowing/GFX stack below is only pulled in by the enabled backend
# features; the rest of the project never sees these crates.
winit = { version = "0.30", optional = true }
glutin = { version = "0.32", optional = true }
glow = { version = "0.16", optional = true }
raw-window-handle = { version = "0.6", optional = true }
# Gamepad input behind the `gamepad` feature (owner-approved: gilrs).
gilrs = { version = "0.11", optional = true }
# HUD text rendering behind the `text` feature (owner-approved:
# glyph_brush + the embedded Monocraft OFL font).
glyph_brush = { version = "0.7", optional = true }

# Backend selection (specs.md §3): OpenGL is the default; Vulkan is opt-in.
# Backends are implemented inside this crate only; the client never sees a
# raw GFX API.
[features]
default = ["opengl", "gamepad"]
opengl = ["dep:winit", "dep:glutin", "dep:glow", "dep:raw-window-handle"]
vulkan = [] # planned: ash
gamepad = ["dep:gilrs"]
text = ["dep:glyph_brush"]
